services:
  # 슬랙 봇 서버
  - type: web
    name: startup-grant-bot-simple
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SPREADSHEET_KEY
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS
        sync: false

  # 크롤러 (매일 자정)
  - type: cron
    name: crawler
    env: python
    schedule: "0 15 * * *"  # 매일 15:00 UTC = 매일 00:00 KST
    buildCommand: pip install -r requirements.txt
    startCommand: python crawler.py
    envVars:
      - key: SPREADSHEET_KEY
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS
        sync: false
      - key: BIZINFO_API_KEY
        sync: false
      - key: KSTARTUP_API_KEY
        sync: false
      - key: MSS_API_KEY
        sync: false
      - key: SMES_API_KEY
        sync: false
